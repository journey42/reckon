name: Deploy Backend Container App

on:
  push:
    branches: [ master ]
    paths:
      - Dockerfile
      - requirements.txt
      - rxconfig.py
      - rhiz/**
      - scripts/**
  workflow_dispatch:

env:
  IMAGE_NAME: rhiz-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: |
          token=$(az acr login --name ${{ secrets.ACR_NAME }} --expose-token --output tsv --query accessToken)
          echo "$token" | docker login ${{ secrets.ACR_LOGIN_SERVER }} --username 00000000-0000-0000-0000-000000000000 --password-stdin

      - name: Build backend image
        run: |
          TAG=${GITHUB_SHA::7}
          docker build \
            --build-arg API_URL=${{ secrets.PUBLIC_API_URL }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${IMAGE_NAME}:${TAG} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${IMAGE_NAME}:latest \
            .

      - name: Push backend image
        run: |
          TAG=${GITHUB_SHA::7}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${IMAGE_NAME}:${TAG}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${IMAGE_NAME}:latest

      - name: Update Container App
        uses: azure/cli@v1
        with:
          inlineScript: |
            set -euo pipefail
            TAG=${GITHUB_SHA::7}
            DB_CONN="${{ secrets.DB_URL }}"

            # Email is now read from AZURE_COMMUNICATION_CONNECTION_STRING. The
            # app needs it to exist in the Container App; deploy it from a GitHub
            # secret when one is configured, and otherwise leave whatever an
            # administrator set in the portal alone (--set-env-vars preserves
            # unrelated environment settings).
            ACS_CONN="${{ secrets.AZURE_COMMUNICATION_CONNECTION_STRING }}"
            ACS_SECRET_ENV=""
            if [ -n "$ACS_CONN" ]; then
              az containerapp secret set \
                --name ${{ secrets.CONTAINERAPP_NAME }} \
                --resource-group ${{ secrets.RESOURCE_GROUP }} \
                --secrets acs-connection-string="$ACS_CONN"
              ACS_SECRET_ENV="AZURE_COMMUNICATION_CONNECTION_STRING=secretref:acs-connection-string"
            fi

            az containerapp secret set \
              --name ${{ secrets.CONTAINERAPP_NAME }} \
              --resource-group ${{ secrets.RESOURCE_GROUP }} \
              --secrets db-url="$DB_CONN"

            # Email now needs AZURE_COMMUNICATION_CONNECTION_STRING. Refuse to
            # roll out an image that will silently break verification mail if
            # the credential is neither in a GitHub secret nor already on the
            # Container App. A portal-configured env var counts, which is why
            # --set-env-vars preserves unrelated settings.
            ACS_ENV_COUNT=$(az containerapp show \
              --name ${{ secrets.CONTAINERAPP_NAME }} \
              --resource-group ${{ secrets.RESOURCE_GROUP }} \
              --query "properties.template.containers[0].env[].name" -o tsv \
              | grep -c '^AZURE_COMMUNICATION_CONNECTION_STRING$' || true)
            if [ -z "$ACS_SECRET_ENV" ] && [ "${ACS_ENV_COUNT:-0}" -eq 0 ]; then
              echo "::error::AZURE_COMMUNICATION_CONNECTION_STRING is not configured. Set it as the GitHub secret AZURE_COMMUNICATION_CONNECTION_STRING or in the Container App before deploying; otherwise email (verification, resets, welcome) will fail."
              exit 1
            fi

            NEW_REVISION=$(az containerapp update \
              --name ${{ secrets.CONTAINERAPP_NAME }} \
              --resource-group ${{ secrets.RESOURCE_GROUP }} \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/${IMAGE_NAME}:${TAG} \
              --set-env-vars API_URL=${{ secrets.PUBLIC_API_URL }} \
                             PUBLIC_BASE_URL=https://www.rhiz.ai \
                             SUNEDITOR_TOOLBAR_ENABLED=0 \
                             RUN_MIGRATIONS_ON_START=1 \
                             DB_URL=secretref:db-url \
                             $ACS_SECRET_ENV \
              --query properties.latestRevisionName -o tsv)

            echo "Deployed revision: ${NEW_REVISION:-<unknown>}"

            if [ -z "${NEW_REVISION}" ]; then
              echo "::error::No revision name returned from az containerapp update."
              exit 1
            fi

            echo "Waiting for revision ${NEW_REVISION} to become healthy..."
            STATE=""
            for i in $(seq 1 18); do
              STATE=$(az containerapp revision show \
                --name ${{ secrets.CONTAINERAPP_NAME }} \
                --resource-group ${{ secrets.RESOURCE_GROUP }} \
                --revision "$NEW_REVISION" \
                --query properties.runningState -o tsv || true)
              echo "  [$i] runningState=${STATE:-<none>}"
              if [ "$STATE" = "Running" ]; then
                echo "Revision ${NEW_REVISION} is running."
                break
              fi
              if [ "$STATE" = "Failed" ]; then
                break
              fi
              sleep 10
            done

            az containerapp revision show \
              --name ${{ secrets.CONTAINERAPP_NAME }} \
              --resource-group ${{ secrets.RESOURCE_GROUP }} \
              --revision "$NEW_REVISION"

            # Fail the deploy loudly if the new revision never became healthy,
            # instead of reporting success on a crash-looping container.
            if [ "$STATE" != "Running" ]; then
              echo "::error::Revision ${NEW_REVISION} did not reach Running (last state: ${STATE:-<none>}). Recent container logs:"
              az containerapp logs show \
                --name ${{ secrets.CONTAINERAPP_NAME }} \
                --resource-group ${{ secrets.RESOURCE_GROUP }} \
                --revision "$NEW_REVISION" \
                --container ${IMAGE_NAME} \
                --type console --tail 60 || true
              exit 1
            fi
