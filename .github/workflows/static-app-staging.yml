name: Deploy Static Web App (Staging)

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Export frontend
        # STAGING_SPA_MODE=1 exports with --no-ssr, i.e. one root-only HTML shell
        # for every route instead of prerendering the static ones. It exists so
        # the hydration question can be settled by measuring the deployed site
        # rather than by reading framework docs; flip the variable off to go back
        # to prerendering. The exported bundle differs between the two modes, so
        # the export fixups below are what keep deep links working either way.
        env:
          API_URL: ${{ secrets.PUBLIC_API_URL_STAGING }}
          TOOLBAR_ENABLED: 0
          SPA_MODE: ${{ vars.STAGING_SPA_MODE }}
        run: |
          if [ "$SPA_MODE" = "1" ]; then
            echo "exporting in SPA mode (no route prerendering)"
            reflex export --frontend-only --no-zip --no-ssr
          else
            reflex export --frontend-only --no-zip
          fi
          python scripts/frontend_export_fixups.py --out .web/build/client

      - name: Prepare static artifacts
        run: |
          rm -rf swa-build
          mkdir -p swa-build
          cp -a .web/build/client/. swa-build/
          cp deploy/staticwebapp.config.json swa-build/staticwebapp.config.json
          ls -la swa-build/__spa-fallback.html swa-build/404.html

      - name: Deploy to Azure Static Web Apps
        # Only these inputs exist on the action: app_location,
        # app_artifact_location, skip_app_build, routes_location, the tokens.
        # `production_branch` is NOT one of them — the run logs
        # "Unexpected input(s) 'production_branch'" and ignores it, which is why
        # editing it here did nothing for so long. Which branch counts as
        # production is a property of the Static Web App resource:
        #   az rest --method get --url '.../Microsoft.Web/staticSites/<name>?api-version=2022-09-01'
        #     → properties.branch   (rhiz-web-staging: staging, rhiz-web: master)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_STAGING }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "swa-build"
          skip_app_build: true
          app_artifact_location: swa-build
