name: Deploy Static Web App

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Export frontend
        env:
          # The backend URL is baked into the bundle at export time, so switching
          # backends (or rolling one back) means re-running this workflow with a
          # different value. It lives in a repository variable rather than a
          # literal so the switch is one setting, not a commit.
          API_URL: ${{ vars.PUBLIC_API_URL || 'https://rhiz-backend.politefield-c0f001d2.eastus.azurecontainerapps.io' }}
          TOOLBAR_ENABLED: 0
        run: reflex export --frontend-only --no-zip

      - name: Prepare static artifacts
        run: |
          rm -rf swa-build
          mkdir -p swa-build
          cp -a .web/build/client/. swa-build/
          cp deploy/staticwebapp.config.json swa-build/staticwebapp.config.json

      - name: Deploy to Azure Static Web Apps
        # See the note in static-app-staging.yml: `production_branch`,
        # `skip_api_build` and `is_static_export` are not inputs of this action
        # and are silently ignored. Production's branch is pinned on the
        # resource itself (rhiz-web → properties.branch = master), so uploading
        # from anywhere other than master would create a throwaway staging
        # environment instead of updating www.rhiz.ai.
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "swa-build"
          skip_app_build: true
          app_artifact_location: swa-build
